name: Manual Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: true
        type: string
      version:
        description: Version label for packaged artifacts
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: true
        default: main
        type: string
      version:
        description: Version label for packaged artifacts (for example v1.2.3-special)
        required: true
        type: string

env:
  APP_NAME: wgd
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build native target
        env:
          WGD_GIT_TAG: ${{ inputs.version }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Import signing certificate into temporary keychain
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::${keychain_password}"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          printf '%s' "${CERT_BASE64}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "${keychain}" \
            -P "${CERT_PASSWORD}" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S "apple-tool:,apple:,codesign:" \
            -s -k "${keychain_password}" "${keychain}" >/dev/null
          security list-keychains -d user -s "${keychain}" login.keychain-db

      - name: Sign binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${APP_NAME}"
          codesign --force --timestamp --options runtime \
            --sign "Developer ID Application" "${binary}"
          codesign --verify --strict --verbose=2 "${binary}"

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          # The release workflow and the cask template both name assets from
          # the v-stripped version, so strip a leading `v` here as well.
          version="${version#v}"
          asset_base="${APP_NAME}-${version}-${{ matrix.target }}"
          mkdir -p dist "${asset_base}" dmg-root
          cp "target/${{ matrix.target }}/release/${APP_NAME}" "${asset_base}/"
          cp "target/${{ matrix.target }}/release/${APP_NAME}" dmg-root/
          tar -czf "dist/${asset_base}.tar.gz" "${asset_base}"
          # The DMG carries the binary at the volume root; the cask's
          # `binary "wgd"` stanza depends on that layout.
          hdiutil create -volname "${APP_NAME}" -srcfolder dmg-root \
            -ov -format UDZO "dist/${asset_base}.dmg"
          codesign --force --timestamp \
            --sign "Developer ID Application" "dist/${asset_base}.dmg"

      - name: Notarize and staple DMG
        shell: bash
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/asc-key.p8"
          printf '%s' "${ASC_KEY_P8}" > "${key_file}"
          dmg=(dist/*.dmg)
          xcrun notarytool submit "${dmg[0]}" \
            --key "${key_file}" --key-id "${ASC_KEY_ID}" \
            --issuer "${ASC_ISSUER_ID}" --wait
          rm "${key_file}"
          xcrun stapler staple "${dmg[0]}"
          xcrun stapler validate "${dmg[0]}"

      - name: Generate checksums
        shell: bash
        working-directory: dist
        # Stapling rewrites the DMG, so checksums must be computed after the
        # staple step, not during packaging.
        run: |
          set -euo pipefail
          for f in *.tar.gz *.dmg; do
            shasum -a 256 "${f}" > "${f}.sha256"
          done

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ inputs.version }}
          path: dist/*
          if-no-files-found: error
