name: Manual Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: true
        type: string
      version:
        description: Version label for packaged artifacts
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build (branch, tag, or SHA)
        required: true
        default: main
        type: string
      version:
        description: Version label for packaged artifacts (for example v1.2.3-special)
        required: true
        type: string

env:
  APP_NAME: wgd
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build native target
        shell: bash
        env:
          WGD_GIT_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # github.sha is the triggering commit, not necessarily inputs.ref,
          # so read the hash from the checked-out tree.
          WGD_GIT_COMMIT="$(git rev-parse --short=8 HEAD)"
          export WGD_GIT_COMMIT
          cargo build --release --locked --target ${{ matrix.target }}

      - name: Import signing certificate into temporary keychain
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::${keychain_password}"
          # Secrets set from a file or a pasted clipboard often carry a
          # trailing newline; that newline becomes a literal character in the
          # `-P` argument below and `security import` reports it as a wrong
          # password, so strip embedded newlines rather than fail on them.
          cert_password="$(printf '%s' "${CERT_PASSWORD}" | tr -d '\n')"
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          printf '%s' "${CERT_BASE64}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "${keychain}" \
            -P "${cert_password}" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S "apple-tool:,apple:,codesign:" \
            -s -k "${keychain_password}" "${keychain}" >/dev/null
          security list-keychains -d user -s "${keychain}" login.keychain-db

      - name: Sign binary
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${APP_NAME}"
          codesign --force --timestamp --options runtime \
            --sign "Developer ID Application" "${binary}"
          codesign --verify --strict --verbose=2 "${binary}"

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          # The menu bar app uses macOS 26 APIs behind `#available`, which
          # only compile against the macOS 26 SDK (Xcode 26 or newer). The
          # runner image's default Xcode may be older, so pick the newest
          # installed one and fail clearly if none is recent enough.
          xcode="$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)"
          major="$(basename "${xcode}" .app | sed -E 's/^Xcode_([0-9]+).*/\1/')"
          if [ "${major}" -lt 26 ]; then
            echo "::error::need Xcode 26 or newer for the menu bar app, newest installed is ${xcode}"
            exit 1
          fi
          sudo xcode-select -s "${xcode}"
          xcodebuild -version

      - name: Build and sign menu bar app
        shell: bash
        env:
          # Same label as the CLI build above; the Makefile adds the commit.
          WGD_GIT_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          make -C macos/WgdBar app VERSION="${version#v}" \
            SIGN_IDENTITY="Developer ID Application"

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          # The release workflow and the cask template both name assets from
          # the v-stripped version, so strip a leading `v` here as well.
          version="${version#v}"
          asset_base="${APP_NAME}-${version}-${{ matrix.target }}"
          mkdir -p dist "${asset_base}" dmg-root
          cp "target/${{ matrix.target }}/release/${APP_NAME}" "${asset_base}/"
          cp "target/${{ matrix.target }}/release/${APP_NAME}" dmg-root/
          # ditto keeps the bundle's signature and extended attributes intact.
          ditto target/WgdBar.app dmg-root/WgdBar.app
          # The tar.gz stays the plain CLI download, without the app.
          tar -czf "dist/${asset_base}.tar.gz" "${asset_base}"
          # The DMG carries the binary and WgdBar.app at the volume root; the
          # cask's `binary "wgd"` and `app "WgdBar.app"` stanzas depend on
          # that layout. Notarizing the DMG covers the app inside it.
          # On hosted runners hdiutil intermittently fails with "Resource
          # busy" while XProtect or Spotlight hold the fresh image, so retry.
          for attempt in 1 2 3 4 5; do
            hdiutil create -volname "${APP_NAME}" -srcfolder dmg-root \
              -ov -format UDZO "dist/${asset_base}.dmg" && break
            if [[ $attempt == 5 ]]; then
              echo "::error::hdiutil create failed after ${attempt} attempts"
              exit 1
            fi
            echo "hdiutil create failed (attempt ${attempt}), retrying"
            sleep $((attempt * 5))
          done
          codesign --force --timestamp \
            --sign "Developer ID Application" "dist/${asset_base}.dmg"

      - name: Notarize and staple DMG
        shell: bash
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          key_file="$RUNNER_TEMP/asc-key.p8"
          printf '%s' "${ASC_KEY_P8}" > "${key_file}"
          dmg=(dist/*.dmg)
          xcrun notarytool submit "${dmg[0]}" \
            --key "${key_file}" --key-id "${ASC_KEY_ID}" \
            --issuer "${ASC_ISSUER_ID}" --wait
          rm "${key_file}"
          # stapler fetches the ticket from api.apple-cloudkit.com over HTTP/3
          # (QUIC, UDP 443), and that path drops on GitHub-hosted macOS runners
          # (NSURLError -1005, stapler error 68; actions/runner-images#14924).
          # Blocking outbound UDP 443 makes it fall back to HTTPS over TCP,
          # which works. The runner VM is discarded after the job.
          echo 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E
          # Keep a retry for the remaining transient CloudKit failures.
          retry() {
            local attempt
            for attempt in 1 2 3 4 5; do
              "$@" && return 0
              echo "::warning::'$*' failed (attempt ${attempt}/5), retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            done
            "$@"
          }
          retry xcrun stapler staple "${dmg[0]}"
          retry xcrun stapler validate "${dmg[0]}"

      - name: Generate checksums
        shell: bash
        working-directory: dist
        # Stapling rewrites the DMG, so checksums must be computed after the
        # staple step, not during packaging.
        run: |
          set -euo pipefail
          for f in *.tar.gz *.dmg; do
            shasum -a 256 "${f}" > "${f}.sha256"
          done

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ inputs.version }}
          path: dist/*
          if-no-files-found: error
