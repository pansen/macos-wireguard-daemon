name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and attach release assets to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    name: Validate with cargo test
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

  build:
    name: Build release artifacts
    needs: test
    uses: ./.github/workflows/manual-build.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
      version: ${{ inputs.tag || github.ref_name }}

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}

  update-homebrew-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs:
      - build
      - release
    if: ${{ !contains(inputs.tag || github.ref_name, '-') }}
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute cask values
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          # The cask template builds both the download URL and the asset
          # path from its own `version` stanza (via Ruby interpolation, so
          # `brew audit` sees a versioned url instead of flagging a bare
          # string as "unversioned"), so the uploaded asset must be named
          # from this same v-stripped `version`, not the raw tag.
          asset="wgd-${version}-aarch64-apple-darwin.tar.gz"
          sha256="$(cut -d' ' -f1 "dist/${asset}.sha256")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"
          echo "asset_dir=${asset%.tar.gz}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: pansen/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Render cask
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tap/Casks
          sed \
            -e "s|__VERSION__|${{ steps.vars.outputs.version }}|" \
            -e "s|__SHA256__|${{ steps.vars.outputs.sha256 }}|" \
            -e "s|__ASSET_DIR__|${{ steps.vars.outputs.asset_dir }}|" \
            packaging/homebrew/macos-wireguard-daemon.rb.tmpl > tap/Casks/macos-wireguard-daemon.rb

      - name: Commit and push
        shell: bash
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/macos-wireguard-daemon.rb
          git rm -f --ignore-unmatch Formula/macos-wireguard-daemon.rb
          if git diff --cached --quiet; then
            echo "No cask changes; skipping commit."
            exit 0
          fi
          git commit -m "macos-wireguard-daemon ${{ steps.vars.outputs.version }}"
          git push origin HEAD:main
